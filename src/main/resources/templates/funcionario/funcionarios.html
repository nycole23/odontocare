
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Funcionários | OdontoCare</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm py-3">
    <div class="container">

        <a class="navbar-brand fw-bold fs-4" th:href="@{/funcionario}">
            <i class="bi bi-heart-pulse-fill me-2"></i>OdontoCare
        </a>

        <div class="d-flex gap-2">

            <a th:href="@{/funcionario}" class="btn btn-outline-light rounded-pill">
                <i class="bi bi-house me-1"></i>
                Painel
            </a>

            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-light rounded-pill">
                    <i class="bi bi-box-arrow-right me-1"></i>
                    Sair
                </button>
            </form>

        </div>
    </div>
</nav>

<!-- CONTEÚDO -->
<main class="container py-5">

    <div class="d-flex flex-wrap justify-content-between
                align-items-center gap-3 mb-4">

        <div>

            <span class="badge bg-primary mb-2">ADMINISTRAÇÃO</span>

            <h1 class="fw-bold">Funcionários</h1>

            <p class="text-secondary mb-0">
                Consulte os profissionais cadastrados na clínica.
            </p>

        </div>

        <a th:href="@{/funcionario/cadastro}"
           class="btn btn-primary btn-lg">

            <i class="bi bi-person-plus me-2"></i>
            Novo funcionário

        </a>

    </div>

    <!-- SUCESSO -->
    <div class="alert alert-success"
         th:if="${param.cadastroSucesso}">

        <i class="bi bi-check-circle-fill me-2"></i>
        Funcionário cadastrado com sucesso!

    </div>

    <!-- TABELA -->
    <div class="card border-0 shadow-sm rounded-4">

        <div class="card-body p-4">

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-light">

                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>CRO</th>
                        <th>Especialidade</th>
                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="funcionario : ${funcionarios}">

                        <td th:text="${funcionario.id}"></td>

                        <td>
                            <i class="bi bi-person-circle text-primary me-2"></i>
                            <span th:text="${funcionario.usuario.nome}"></span>
                        </td>

                        <td th:text="${funcionario.usuario.email}"></td>

                        <td th:text="${funcionario.cro}"></td>

                        <td>
                                <span class="badge bg-info text-dark"
                                      th:text="${funcionario.especialidade}">
                                </span>
                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(funcionarios)}">

                        <td colspan="5" class="text-center py-5">

                            <i class="bi bi-people text-secondary fs-1"></i>

                            <p class="text-secondary mt-3 mb-0">
                                Nenhum funcionário cadastrado.
                            </p>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>
    </div>

</main>

<!-- RODAPÉ -->
<footer class="text-center py-4">

    <p class="text-secondary small mb-0">
        &copy; 2026 OdontoCare. Todos os direitos reservados.
    </p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
