
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastrar Funcionário | OdontoCare</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm py-3">
    <div class="container">

        <a class="navbar-brand fw-bold fs-4" th:href="@{/funcionario}">
            <i class="bi bi-heart-pulse-fill me-2"></i>OdontoCare
        </a>

        <a th:href="@{/funcionario}" class="btn btn-outline-light rounded-pill px-3">
            <i class="bi bi-arrow-left me-2"></i>Voltar ao painel
        </a>

    </div>
</nav>

<!-- CONTEÚDO -->
<main class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card border-0 shadow-sm rounded-4">

                <div class="card-body p-4 p-md-5">

                    <div class="text-center mb-4">

                        <div class="bg-primary bg-opacity-10 rounded-circle
                                    d-inline-flex align-items-center
                                    justify-content-center mb-3"
                             style="width: 75px; height: 75px;">

                            <i class="bi bi-person-plus text-primary fs-1"></i>

                        </div>

                        <h2 class="fw-bold">Cadastrar funcionário</h2>

                        <p class="text-secondary">
                            Preencha os dados do novo profissional.
                        </p>

                    </div>

                    <!-- ERRO -->
                    <div class="alert alert-danger"
                         th:if="${erro}"
                         th:text="${erro}">
                    </div>

                    <form th:action="@{/funcionario/cadastro}"
                          th:object="${funcionario}"
                          method="post">

                        <!-- DADOS PESSOAIS -->
                        <h5 class="fw-bold text-primary mb-3">
                            <i class="bi bi-person me-2"></i>
                            Dados pessoais
                        </h5>

                        <div class="mb-3">

                            <label for="nome" class="form-label fw-semibold">
                                Nome completo
                            </label>

                            <input type="text"
                                   class="form-control form-control-lg"
                                   id="nome"
                                   th:field="*{nome}"
                                   placeholder="Nome completo do profissional"
                                   maxlength="100"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label for="email" class="form-label fw-semibold">
                                E-mail
                            </label>

                            <input type="email"
                                   class="form-control form-control-lg"
                                   id="email"
                                   th:field="*{email}"
                                   placeholder="profissional@email.com"
                                   maxlength="150"
                                   required>

                        </div>

                        <hr class="my-4">

                        <!-- DADOS PROFISSIONAIS -->
                        <h5 class="fw-bold text-primary mb-3">
                            <i class="bi bi-briefcase me-2"></i>
                            Dados profissionais
                        </h5>

                        <div class="mb-3">

                            <label for="cro" class="form-label fw-semibold">
                                Número do CRO
                            </label>

                            <input type="text"
                                   class="form-control form-control-lg"
                                   id="cro"
                                   th:field="*{cro}"
                                   placeholder="Ex.: 12345-SP"
                                   maxlength="20"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label for="especialidade"
                                   class="form-label fw-semibold">
                                Especialidade
                            </label>

                            <select class="form-select form-select-lg"
                                    id="especialidade"
                                    th:field="*{especialidade}"
                                    required>

                                <option value="">Selecione a especialidade</option>

                                <option value="Clínica Geral">Clínica Geral</option>
                                <option value="Ortodontia">Ortodontia</option>
                                <option value="Endodontia">Endodontia</option>
                                <option value="Implantodontia">Implantodontia</option>
                                <option value="Periodontia">Periodontia</option>
                                <option value="Odontopediatria">Odontopediatria</option>
                                <option value="Prótese Dentária">Prótese Dentária</option>
                                <option value="Cirurgia Odontológica">Cirurgia Odontológica</option>

                            </select>

                        </div>

                        <hr class="my-4">

                        <!-- SENHA -->
                        <h5 class="fw-bold text-primary mb-3">
                            <i class="bi bi-shield-lock me-2"></i>
                            Dados de acesso
                        </h5>

                        <div class="mb-3">

                            <label for="senha" class="form-label fw-semibold">
                                Senha
                            </label>

                            <input type="password"
                                   class="form-control form-control-lg"
                                   id="senha"
                                   th:field="*{senha}"
                                   placeholder="Crie uma senha"
                                   minlength="6"
                                   required>

                        </div>

                        <div class="mb-4">

                            <label for="confirmarSenha"
                                   class="form-label fw-semibold">
                                Confirmar senha
                            </label>

                            <input type="password"
                                   class="form-control form-control-lg"
                                   id="confirmarSenha"
                                   th:field="*{confirmarSenha}"
                                   placeholder="Digite a senha novamente"
                                   minlength="6"
                                   required>

                        </div>

                        <!-- BOTÕES -->
                        <div class="d-grid gap-2">

                            <button type="submit"
                                    class="btn btn-primary btn-lg fw-semibold">

                                <i class="bi bi-check-circle me-2"></i>
                                Cadastrar funcionário

                            </button>

                            <a th:href="@{/funcionario}"
                               class="btn btn-outline-secondary">

                                Cancelar

                            </a>

                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</main>

<!-- RODAPÉ -->
<footer class="text-center py-4">

    <p class="text-secondary small mb-0">
        &copy; 2026 OdontoCare. Todos os direitos reservados.
    </p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
