
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro | OdontoCare</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary py-3">
    <div class="container">

        <a class="navbar-brand fw-bold fs-4" th:href="@{/}">
            <i class="bi bi-heart-pulse-fill me-2"></i>OdontoCare
        </a>

        <a th:href="@{/}" class="btn btn-outline-light">
            <i class="bi bi-arrow-left me-2"></i>Voltar
        </a>

    </div>
</nav>

<!-- CADASTRO -->
<main class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-7 col-md-10">

            <div class="card border-0 shadow rounded-4">

                <div class="card-body p-4 p-md-5">

                    <div class="text-center mb-4">

                        <i class="bi bi-person-plus-fill text-primary display-3"></i>

                        <h2 class="fw-bold text-primary mt-2">
                            Criar minha conta
                        </h2>

                        <p class="text-secondary">
                            Preencha seus dados para começar a utilizar nossos serviços.
                        </p>

                    </div>

                    <!-- MENSAGEM DE ERRO -->
                    <div class="alert alert-danger"
                         th:if="${erro}"
                         th:text="${erro}">
                    </div>

                    <!-- FORMULÁRIO -->
                    <form th:action="@{/cadastro}"
                          th:object="${cliente}"
                          method="post">

                        <div class="mb-3">

                            <label for="nome" class="form-label fw-semibold">
                                Nome completo
                            </label>

                            <input type="text"
                                   class="form-control form-control-lg"
                                   id="nome"
                                   th:field="*{nome}"
                                   placeholder="Digite seu nome completo"
                                   maxlength="100"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label for="email" class="form-label fw-semibold">
                                E-mail
                            </label>

                            <input type="email"
                                   class="form-control form-control-lg"
                                   id="email"
                                   th:field="*{email}"
                                   placeholder="exemplo@email.com"
                                   maxlength="150"
                                   required>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label for="cpf" class="form-label fw-semibold">
                                    CPF
                                </label>

                                <input type="text"
                                       class="form-control form-control-lg"
                                       id="cpf"
                                       th:field="*{cpf}"
                                       placeholder="Somente números"
                                       maxlength="14"
                                       required>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label for="telefone" class="form-label fw-semibold">
                                    Telefone
                                </label>

                                <input type="tel"
                                       class="form-control form-control-lg"
                                       id="telefone"
                                       th:field="*{telefone}"
                                       placeholder="(11) 99999-9999"
                                       maxlength="20"
                                       required>

                            </div>

                        </div>

                        <div class="mb-3">

                            <label for="senha" class="form-label fw-semibold">
                                Senha
                            </label>

                            <input type="password"
                                   class="form-control form-control-lg"
                                   id="senha"
                                   th:field="*{senha}"
                                   placeholder="Crie uma senha"
                                   minlength="8"
                                   required>

                        </div>

                        <div class="mb-4">

                            <label for="confirmarSenha" class="form-label fw-semibold">
                                Confirmar senha
                            </label>

                            <input type="password"
                                   class="form-control form-control-lg"
                                   id="confirmarSenha"
                                   th:field="*{confirmarSenha}"
                                   placeholder="Digite sua senha novamente"
                                   minlength="8"
                                   required>

                        </div>

                        <div class="d-grid">

                            <button type="submit"
                                    class="btn btn-primary btn-lg fw-semibold">

                                <i class="bi bi-person-check me-2"></i>
                                Criar minha conta

                            </button>

                        </div>

                    </form>

                    <div class="text-center mt-4">

                        <p class="text-secondary mb-1">
                            Já possui uma conta?
                        </p>

                        <a th:href="@{/login}"
                           class="text-primary fw-bold text-decoration-none">
                            Fazer login
                        </a>

                    </div>

                </div>
            </div>

        </div>
    </div>

</main>

<!-- RODAPÉ -->
<footer class="bg-dark text-white text-center py-4">

    <p class="fw-bold mb-1">
        <i class="bi bi-heart-pulse-fill me-2"></i>OdontoCare
    </p>

    <p class="text-white-50 small mb-0">
        Cuidando do seu sorriso com carinho e dedicação.
    </p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
